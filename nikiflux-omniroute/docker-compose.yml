version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nikiflux-omniroute_app_1
      APP_PORT: 20128

  app:
    image: diegosouzapw/omniroute:latest
    user: "0:0"
    init: true
    restart: on-failure
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    stop_grace_period: 40s
    volumes:
      - ${APP_DATA_DIR}/data/app:/app/data
    environment:
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379
      APP_BIND_HOST: "0.0.0.0"
      DASHBOARD_PORT: "20128"
      API_PORT: "20129"
      LIVE_WS_PORT: "20132"
      REQUIRE_API_KEY: "false"
      OMNIROUTE_MEMORY_MB: "2048"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: docker.io/library/redis:8.6.5-alpine
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Local proxy core for VPN subscriptions (VLESS/VMess/Trojan/SS).
  # Shares the app container's network namespace, so its SOCKS5 on
  # 127.0.0.1:2080 is reachable from OmniRoute as loopback, exactly how
  # upstream documents it (operator-run core, one loopback entry per line).
  mihomo:
    image: metacubex/mihomo:latest
    network_mode: service:app
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/mihomo:/root/.config/mihomo
    command: ["-f", "/root/.config/mihomo/config-urltest.yaml"]
