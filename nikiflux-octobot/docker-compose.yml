version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_NIKIFLUX_OCTOBOT_APP_IP
      APP_PORT: $APP_NIKIFLUX_OCTOBOT_PORT

  app:
    image: drakkarsoftware/octobot:stable@sha256:c032a9f91c6f4d6977948e071d03b403e67f24475a9cdfa5748bd02241383724
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 2m
    volumes:
      - ${APP_DATA_DIR}/data/user:/octobot/user
      - ${APP_DATA_DIR}/data/tentacles:/octobot/tentacles
      - ${APP_DATA_DIR}/data/backtesting:/octobot/backtesting
      - ${APP_DATA_DIR}/data/logs:/octobot/logs
    environment:
      TENTACLES_URL_TAG: "3.0.0-beta2"
    networks:
      default:
        ipv4_address: $APP_NIKIFLUX_OCTOBOT_APP_IP
