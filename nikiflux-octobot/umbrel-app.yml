path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  First release of OctoBot for umbrelOS as a Community App Store package.


  Packs OctoBot 3.0.0-beta2 with the OctoBot Node web UI on port 8000 and persistent data (user config, tentacles, backtesting and logs).
